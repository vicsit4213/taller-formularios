<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Completado</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm border-success">
            <div class="card-header bg-success text-white">
                <h3 class="card-title mb-0">¡Jugador Registrado Exitosamente!</h3>
            </div>
            <div class="card-body">
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item"><strong>Nombre:</strong> <span th:text="${jugador.nombre}"></span></li>
                    <li class="list-group-item"><strong>Apodo:</strong> <span th:text="${jugador.apodo}"></span></li>
                    <li class="list-group-item"><strong>Edad:</strong> <span th:text="${jugador.edad}"></span> años</li>
                    <li class="list-group-item"><strong>Posición:</strong> <span th:text="${jugador.posicion}"></span></li>
                    <li class="list-group-item"><strong>Nivel de Experiencia:</strong> <span th:text="${jugador.nivelExperiencia}"></span></li>
                    <li class="list-group-item">
                        <strong>Plataformas:</strong>
                        <ul class="mt-2">
                            <li th:each="p : ${jugador.plataformas}" th:text="${p}"></li>
                        </ul>
                    </li>
                </ul>
                <a href="/registro" class="btn btn-outline-primary w-100">Registrar otro jugador</a>
            </div>
        </div>
    </div>
</body>
</html>
