<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head>
    <meta charset="UTF-8">
    <title>Lista de Jugadores</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div style="width: 800px; margin: 30px auto;">
        <h1>Lista de Jugadores</h1>
        
        <!-- Saludo y rol del usuario autenticado -->
        <p>Bienvenido, <span sec:authentication="name">Usuario</span> 
           (Rol: <span sec:authentication="authorities">Roles</span>)</p>

        <!-- Botón de cerrar sesión -->
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <button type="submit">Cerrar sesión</button>
        </form>

        <hr style="margin: 20px 0;">

        <!-- Botón visible SOLO para ADMIN -->
        <div sec:authorize="hasRole('ADMIN')" style="margin-bottom: 15px;">
            <a th:href="@{/jugadores/nuevo}" style="padding: 8px 12px; background: #28a745; color: white; text-decoration: none; border-radius: 4px;">+ Inscribir jugador</a>
        </div>

        <table border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f2f2f2;">
                    <th>Nombre</th>
                    <th>Edad</th>
                    <th>Posición</th>
                    <th sec:authorize="hasRole('ADMIN')">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:for="jugador : ${jugadores}" th:each="jugador : ${jugadores}">
                    <td th:text="${jugador.nombre}">Nombre</td>
                    <td th:text="${jugador.edad}">Edad</td>
                    <td th:text="${jugador.posicion}">Posición</td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/jugadores/{id}/editar(id=${jugador.id})}">Editar</a> |
                        <a th:href="@{/jugadores/{id}/eliminar(id=${jugador.id})}">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
