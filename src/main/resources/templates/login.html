<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div style="width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
        <h2>Iniciar Sesión</h2>
        
        <!-- Mensaje de error si las credenciales fallan -->
        <div th:if="${param.error}" style="color: red; margin-bottom: 10px;">
            Usuario o contraseña incorrectos.
        </div>
        
        <!-- Mensaje cuando cierra sesión -->
        <div th:if="${param.salio}" style="color: green; margin-bottom: 10px;">
            Has cerrado sesión exitosamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div style="margin-bottom: 10px;">
                <label for="username">Usuario:</label><br>
                <input type="text" id="username" name="username" required style="width: 100%;">
            </div>
            
            <div style="margin-bottom: 10px;">
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password" required style="width: 100%;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 8px;">Ingresar</button>
        </form>
    </div>
</body>
</html>
